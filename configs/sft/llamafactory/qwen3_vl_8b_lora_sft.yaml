model_name_or_path: /path/to/Qwen3-VL-8B-Instruct
image_max_pixels: 262144
trust_remote_code: true

stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all
freeze_vision_tower: true
freeze_multi_modal_projector: true
deepspeed: configs/sft/deepspeed/ds_z2_config.json

dataset_dir: /path/to/rendered/dataset
dataset: gen_retry_sft_train
eval_dataset: gen_retry_sft_validation
template: qwen3_vl_nothink
enable_thinking: false
train_on_prompt: false
mask_history: true
packing: false
cutoff_len: 32768
preprocessing_num_workers: 16
dataloader_num_workers: 4

output_dir: runs/sft_checkpoints/qwen3_vl_8b_lora
run_name: gen-retry-flow1000-v9-selective-skill-lora-r16-s42
logging_steps: 5
save_steps: 100
save_total_limit: 3
plot_loss: true
overwrite_output_dir: false
save_only_model: false
report_to: wandb

per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
weight_decay: 1.0e-6
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.02
bf16: true
gradient_checkpointing: true
flash_attn: fa2
ddp_timeout: 180000000
seed: 42
data_seed: 42
resume_from_checkpoint: null

do_eval: true
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 50
